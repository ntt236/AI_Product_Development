<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#skyGrad)"/>
  <!-- Construction scaffolding & crane -->
  <line x1="80" y1="280" x2="80" y2="60" stroke="#f59e0b" stroke-width="4"/>
  <line x1="80" y1="80" x2="260" y2="80" stroke="#f59e0b" stroke-width="4"/>
  <line x1="80" y1="60" x2="260" y2="80" stroke="#d97706" stroke-width="2"/>
  <line x1="240" y1="80" x2="240" y2="160" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4"/>
  <!-- Ground -->
  <rect x="0" y="280" width="600" height="120" fill="url(#groundGrad)"/>
  <!-- Engineer 1 (Holding Blueprint) -->
  <circle cx="240" cy="190" r="24" fill="#f59e0b"/> <!-- Hardhat -->
  <circle cx="240" cy="205" r="18" fill="#fed7aa"/> <!-- Face -->
  <rect x="215" y="230" width="50" height="80" rx="6" fill="#0284c7"/> <!-- Jacket -->
  <!-- Engineer 2 -->
  <circle cx="360" cy="185" r="24" fill="#f59e0b"/> <!-- Hardhat -->
  <circle cx="360" cy="200" r="18" fill="#fed7aa"/> <!-- Face -->
  <rect x="335" y="225" width="50" height="85" rx="6" fill="#10b981"/> <!-- Safety vest -->
  <!-- Blueprints table in between -->
  <rect x="250" y="265" width="100" height="15" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="265" y1="280" x2="260" y2="340" stroke="#94a3b8" stroke-width="4"/>
  <line x1="335" y1="280" x2="340" y2="340" stroke="#94a3b8" stroke-width="4"/>
  <!-- Label badge -->
  <rect x="20" y="20" width="160" height="30" rx="6" fill="#f59e0b" opacity="0.9"/>
  <text x="100" y="40" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">TOEIC Part 1 — Photo 2</text>
</svg>
